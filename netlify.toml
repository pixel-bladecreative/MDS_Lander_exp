# Netlify deploy for the Onus iV mobile lander.
#
# There is no build step: the page is static and the frames are committed.
# `publish` points at site/ so the frames sit at /frames/... exactly as the
# page requests them.
[build]
  publish = "site"
  command = ""

# This is a campaign destination, not something that should compete with
# onusiv.com in search. The page also carries a robots meta tag; this header
# covers assets and any future non-HTML route.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
